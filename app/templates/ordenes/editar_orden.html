
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar orden - Bar Central</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="encabezado">
        <h1>BAR CENTRAL</h1>
        <p>Editar orden</p>
    </header>

    <main class="container mt-5">
        <div class="tarjeta-menu">

            <h2>Modificar información</h2>

            <form method="POST">

                <div class="mb-3 text-start">
                    <label class="form-label">Número de mesa</label>
                    <input type="number" name="numero_mesa"
                           class="form-control" min="1"
                           value="{{ orden[1] }}" required>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">Estado</label>
                    <select name="estado" class="form-select" required>
                        <option value="Abierta" {% if orden[3] == 'Abierta' %}selected{% endif %}>Abierta</option>
                        <option value="En proceso" {% if orden[3] == 'En proceso' %}selected{% endif %}>En proceso</option>
                        <option value="Cerrada" {% if orden[3] == 'Cerrada' %}selected{% endif %}>Cerrada</option>
                    </select>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">Mesero responsable</label>
                    <select name="mesero_id" class="form-select" required>

                        {% for mesero in meseros %}
                        <option value="{{ mesero[0] }}"
                            {% if mesero[0] == orden[4] %}selected{% endif %}>
                            {{ mesero[1] }}
                        </option>
                        {% endfor %}

                    </select>
                </div>

                <button type="submit" class="boton-menu">
                    Guardar cambios
                </button>

                <a href="/ordenes" class="btn btn-secondary">
                    Cancelar
                </a>

            </form>
        </div>
    </main>

    <footer class="pie-pagina">
        <p>Sistema de Gestión de un Bar - Proyecto de Programación Web</p>
    </footer>

</body>
</html>
