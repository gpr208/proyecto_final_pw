
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar categoría - El super bar de moe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header class="encabezado">
        <h1>MOE´S BAR 🍺</h1>
        <p>Editar categoría</p>
    </header>

    <main class="container mt-5">

        <div class="tarjeta-menu mx-auto" style="max-width: 600px;">

            <h3 class="mb-4">Modificar categoría</h3>

            <form method="POST">

                <div class="mb-3 text-start">
                    <label class="form-label">Nombre</label>
                    <input
                        type="text"
                        name="nombre"
                        class="form-control"
                        value="{{ categoria[1] }}"
                        maxlength="50"
                        required
                    >
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">Descripción</label>
                    <textarea
                        name="descripcion"
                        class="form-control"
                        rows="4"
                    >{{ categoria[2] or '' }}</textarea>
                </div>

                <button type="submit" class="boton-menu">
                    Guardar cambios
                </button>

                <a href="/categorias" class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>

    </main>

</body>
</html>
