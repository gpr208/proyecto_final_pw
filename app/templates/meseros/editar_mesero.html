
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar mesero - Bar Central</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="encabezado">
        <h1>BAR CENTRAL</h1>
        <p>Editar información del mesero</p>
    </header>

    <main class="container mt-5">

        <div class="tarjeta-menu">
            <h2>Modificar información</h2>

            <form method="POST">

                <div class="mb-3 text-start">
                    <label class="form-label">Nombre completo</label>
                    <input type="text" name="nombre" class="form-control"
                           value="{{ mesero[1] }}" required>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">Teléfono</label>
                    <input type="text" name="telefono" class="form-control"
                           value="{{ mesero[2] }}">
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">Fecha de contratación</label>
                    <input type="date" name="fecha" class="form-control"
                           value="{{ mesero[3] }}" required>
                </div>

                <button type="submit" class="boton-menu">
                    Guardar cambios
                </button>

                <a href="/meseros" class="btn btn-secondary">
                    Cancelar
                </a>

            </form>
        </div>

    </main>

    <footer class="pie-pagina">
        <p>Sistema de Gestión de un Bar - Proyecto de Programación Web</p>
    </footer>

</body>
</html>
