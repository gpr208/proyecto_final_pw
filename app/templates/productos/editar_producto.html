
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar producto - Bar Central</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="encabezado">
        <h1>BAR CENTRAL</h1>
        <p>Editar producto</p>
    </header>

    <main class="container mt-5">

        <div class="tarjeta-menu">
            <h2>Modificar información</h2>

            <form method="POST">

                <div class="mb-3 text-start">
                    <label class="form-label">Nombre del producto</label>
                    <input type="text" name="nombre" class="form-control"
                           value="{{ producto[1] }}" required>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">Precio</label>
                    <input type="number" name="precio" class="form-control"
                           step="0.01" min="0.01"
                           value="{{ producto[2] }}" required>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">Stock</label>
                    <input type="number" name="stock" class="form-control"
                           min="0" value="{{ producto[3] }}" required>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">Categoría</label>
                    <select name="categoria_id" class="form-select" required>

                        {% for categoria in categorias %}
                        <option value="{{ categoria[0] }}"
                            {% if categoria[0] == producto[4] %}selected{% endif %}>
                            {{ categoria[1] }}
                        </option>
                        {% endfor %}

                    </select>
                </div>

                <button type="submit" class="boton-menu">
                    Guardar cambios
                </button>

                <a href="/productos" class="btn btn-secondary">
                    Cancelar
                </a>

            </form>
        </div>

    </main>

    <footer class="pie-pagina">
        <p>Sistema de Gestión de un Bar - Proyecto de Programación Web</p>
    </footer>

</body>
</html>
