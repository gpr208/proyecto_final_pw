
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo producto - Bar Central</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="encabezado">
        <h1>BAR CENTRAL</h1>
        <p>Registrar nuevo producto</p>
    </header>

    <main class="container mt-5">

        <div class="tarjeta-menu">
            <h2>Información del producto</h2>

            <form method="POST">

                <div class="mb-3 text-start">
                    <label class="form-label">Nombre del producto</label>
                    <input type="text" name="nombre" class="form-control" required>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">Precio</label>
                    <input type="number" name="precio" class="form-control"
                           step="0.01" min="0.01" required>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">Stock</label>
                    <input type="number" name="stock" class="form-control"
                           min="0" required>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">Categoría</label>
                    <select name="categoria_id" class="form-select" required>
                        <option value="">Selecciona una categoría</option>

                        {% for categoria in categorias %}
                        <option value="{{ categoria[0] }}">
                            {{ categoria[1] }}
                        </option>
                        {% endfor %}

                    </select>
                </div>

                <button type="submit" class="boton-menu">
                    Guardar producto
                </button>

                <a href="/productos" class="btn btn-secondary">
                    Cancelar
                </a>

            </form>
        </div>

    </main>

    <footer class="pie-pagina">
        <p>Sistema de Gestión de un Bar - Proyecto de Programación Web</p>
    </footer>

</body>
</html>
