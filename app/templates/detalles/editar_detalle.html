
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar detalle - Bar Central</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="encabezado">
        <h1>BAR CENTRAL</h1>
        <p>Editar detalle de orden</p>
    </header>

    <main class="container mt-5">
        <div class="tarjeta-menu">

            <h2>Modificar información</h2>

            <form method="POST">

                <div class="mb-3 text-start">
                    <label class="form-label">Orden</label>
                    <select name="orden_id" class="form-select" required>

                        {% for orden in ordenes %}
                        <option value="{{ orden[0] }}"
                            {% if orden[0] == detalle[1] %}selected{% endif %}>
                            Orden #{{ orden[0] }}
                        </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">Producto</label>
                    <select name="producto_id" class="form-select" required>

                        {% for producto in productos %}
                        <option value="{{ producto[0] }}"
                            {% if producto[0] == detalle[2] %}selected{% endif %}>
                            {{ producto[1] }}
                        </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">Cantidad</label>
                    <input type="number" name="cantidad"
                           class="form-control" min="1"
                           value="{{ detalle[3] }}" required>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">Precio unitario</label>
                    <input type="number" name="precio_unitario"
                           class="form-control" step="0.01" min="0.01"
                           value="{{ detalle[4] }}" required>
                </div>

                <button type="submit" class="boton-menu">
                    Guardar cambios
                </button>

                <a href="/detalles" class="btn btn-secondary">
                    Cancelar
                </a>

            </form>
        </div>
    </main>

    <footer class="pie-pagina">
        <p>Sistema de Gestión de un Bar - Proyecto de Programación Web</p>
    </footer>

</body>
</html>
